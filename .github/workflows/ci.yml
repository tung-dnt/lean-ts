name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leants
          POSTGRES_PASSWORD: leants
          POSTGRES_DB: leants
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leants -d leants"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests use this server instead of starting containers; each package's run creates
      # and drops its own database on it (packages/db/src/testing.ts).
      TEST_DATABASE_URL: postgres://leants:leants@localhost:5432/leants
      # Type-aware lint on tsgolint, not the bundled tsrs prerelease (vite.config.ts).
      OXLINT_TSGOLINT_PATH: node_modules/.bin/tsgolint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Vite+, Node and pnpm, install
        uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # One step per gate of `vp run ready`. Each runs even when an earlier one failed,
      # so one run shows everything that is wrong.
      - name: Format, lint, type-aware lint
        if: ${{ !cancelled() }}
        run: vp run check

      - name: Types
        if: ${{ !cancelled() }}
        run: vp run types

      - name: Boundaries
        if: ${{ !cancelled() }}
        run: vp run boundaries

      - name: Migrations consistent
        if: ${{ !cancelled() }}
        run: vp run db:check

      - name: Workflow graphs drawable
        if: ${{ !cancelled() }}
        run: vp run workflows:graph

      - name: Workflow contracts
        if: ${{ !cancelled() }}
        run: vp run workflows:contract

      - name: Tests (real PostgreSQL)
        if: ${{ !cancelled() }}
        run: vp run -r test

      - name: Build
        if: ${{ !cancelled() }}
        run: vp run -r build

      - name: Infrastructure synthesizes (CDK)
        if: ${{ !cancelled() }}
        run: vp run infra:synth

  # Puts a Mermaid graph of each changed durable workflow (before and after), then its contract
  # card, into the PR body between <!-- workflow-graphs:… --> and <!-- workflow-contracts:… -->
  # markers; the rest of the body is kept. Same-repository PRs only: a fork's token cannot edit the PR.
  workflow-graphs:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs against the merge base with the target branch.
          fetch-depth: 0

      - name: Set up Vite+, Node and pnpm, install
        uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Update the workflow graphs in the PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/workflow-graph.ts --base "origin/${{ github.base_ref }}" --pr "${{ github.event.pull_request.number }}"

      - name: Update the workflow contracts in the PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/workflow-contract.ts --base "origin/${{ github.base_ref }}" --pr "${{ github.event.pull_request.number }}"
